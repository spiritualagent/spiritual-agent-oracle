<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060e;
  --card:#0e0d1a;
  --border:#1a1830;
  --accent:#9b8aff;
  --accent2:#c5a0ff;
  --gold:#e8c469;
  --text:#d8d6ee;
  --dim:#6e6b8a;
  --bright:#f4f2ff;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stars canvas{display:block;width:100%;height:100%}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:60px 24px 20px}
.header-logo{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
.header-sub{font-size:12px;color:var(--dim);letter-spacing:1px}
.screen{
  display:none;flex-direction:column;align-items:center;
  width:100%;max-width:480px;padding:0 24px;animation:fadeUp .6s ease;
}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.oracle-title{
  font-family:'Noto Serif JP',serif;font-size:clamp(20px,5vw,28px);font-weight:600;
  color:var(--bright);text-align:center;line-height:1.6;margin:40px 0 16px;
}
.oracle-desc{font-size:14px;color:var(--dim);text-align:center;line-height:1.8;margin-bottom:40px}
.card-container{
  perspective:800px;width:280px;height:400px;margin:0 auto 40px;cursor:pointer;
}
.card-container.disabled{cursor:wait;opacity:.7}
.card-inner{
  position:relative;width:100%;height:100%;
  transition:transform .8s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;
}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.card-front{
  background:linear-gradient(145deg,#12103a,#1a1445);
  border:1px solid #2a2560;box-shadow:0 0 60px rgba(155,138,255,.08);
}
.card-front-symbol{font-size:64px;margin-bottom:20px;opacity:.8}
.card-front-text{font-family:'Noto Serif JP',serif;font-size:14px;color:var(--accent2);letter-spacing:3px}
.card-front-hint{font-size:11px;color:var(--dim);margin-top:20px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.card-back{
  transform:rotateY(180deg);
  background:linear-gradient(145deg,#1a1050,#0d0825);
  border:1px solid var(--accent);box-shadow:0 0 80px rgba(155,138,255,.15);
  padding:32px 24px;text-align:center;overflow-y:auto;
}
.card-back-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.card-back-message{
  font-family:'Noto Serif JP',serif;font-size:16px;font-weight:400;
  color:var(--bright);line-height:2;margin-bottom:20px;
}
.card-back-from{font-size:11px;color:var(--dim)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 32px;border:none;border-radius:50px;
  font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;transition:all .3s;text-decoration:none;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#7b68ee);color:#fff;
  box-shadow:0 4px 24px rgba(155,138,255,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 32px rgba(155,138,255,.4)}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);background:rgba(155,138,255,.05)}
.mode-switch{display:flex;gap:8px;margin:30px 0 20px}
.mode-btn{
  padding:8px 20px;border-radius:30px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:transparent;color:var(--dim);
  cursor:pointer;transition:all .3s;font-family:'Noto Sans JP',sans-serif;
}
.mode-btn.active{background:rgba(155,138,255,.12);border-color:var(--accent);color:var(--accent)}
.diag-question{
  font-family:'Noto Serif JP',serif;font-size:18px;color:var(--bright);
  text-align:center;margin:30px 0 24px;line-height:1.7;
}
.diag-options{display:flex;flex-direction:column;gap:12px;width:100%;margin-bottom:30px}
.diag-option{
  padding:16px 20px;border:1px solid var(--border);border-radius:14px;
  background:var(--card);color:var(--text);font-size:14px;cursor:pointer;
  transition:all .3s;text-align:left;font-family:'Noto Sans JP',sans-serif;line-height:1.6;
}
.diag-option:hover{border-color:var(--accent);background:rgba(155,138,255,.06);transform:translateX(4px)}
.result-section{width:100%;margin-bottom:20px}
.result-msg{
  font-family:'Noto Serif JP',serif;font-size:16px;color:var(--bright);
  text-align:center;line-height:2;margin:20px 0 32px;padding:24px;
  background:linear-gradient(145deg,rgba(26,16,80,.5),rgba(13,8,37,.5));
  border:1px solid rgba(155,138,255,.15);border-radius:16px;
}
.result-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.content-card{
  display:block;padding:16px 20px;border:1px solid var(--border);border-radius:12px;
  background:var(--card);margin-bottom:10px;text-decoration:none;transition:all .3s;
}
.content-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(155,138,255,.1)}
.content-type{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.type-youtube{color:#ef6a6a}
.type-note{color:var(--gold)}
.type-podcast{color:#4ecb8d}
.content-title{font-size:14px;font-weight:500;color:var(--bright);line-height:1.6}
.share-area{text-align:center;margin:24px 0 40px}
.share-text{font-size:12px;color:var(--dim);margin-bottom:12px}
.share-buttons{display:flex;gap:10px;justify-content:center}
.footer{text-align:center;padding:40px 24px;width:100%}
.footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.footer-links a{font-size:12px;color:var(--dim);text-decoration:none;transition:color .3s}
.footer-links a:hover{color:var(--accent)}
.footer-copy{font-size:11px;color:var(--dim);opacity:.5}
.loading-text{font-size:12px;color:var(--dim);text-align:center;margin:8px 0;animation:pulse 2s ease-in-out infinite}
@media(max-width:400px){.card-container{width:240px;height:340px}}
.streak-badge{display:inline-block;font-size:11px;color:var(--gold);letter-spacing:1px;margin-top:4px}
.locked-note{text-align:center;font-size:13px;color:var(--gold);line-height:1.8;margin:8px 0 24px}
.history-toggle-btn{display:block;margin:16px auto 0;background:none;border:none;color:var(--dim);font-size:12px;text-decoration:underline;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.history-toggle-btn:hover{color:var(--accent)}
.history-panel{margin-top:20px;text-align:left}
.history-item{padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px}
.history-date{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.history-text{font-size:13px;color:var(--text);line-height:1.7}
.diag-cta{text-align:center;margin:8px 0 30px}
</style>
</head>
<body>

<div class="stars"><canvas id="starCanvas"></canvas></div>

<div class="app">
  <div class="header">
    <div class="header-logo">Spiritual Agent</div>
    <div class="header-sub">プレアデス高等評議会からのメッセージ</div>
  </div>

  <div class="mode-switch">
    <button class="mode-btn active" onclick="switchMode('oracle')">✦ 今日のメッセージ</button>
    <button class="mode-btn" onclick="switchMode('diag')">◎ 魂の診断</button>
  </div>

  <!-- SCREEN: Oracle -->
  <div class="screen active" id="screen-oracle">
    <div class="oracle-title">宇宙が、今日のあなたに<br>届けたい言葉があります</div>
    <div class="oracle-desc">カードに触れて、<br>プレアデスからのメッセージを受け取ってください。</div>
    <div id="streakBadge" class="streak-badge" style="display:none;text-align:center;width:100%"></div>
    <div id="loadingIndicator" class="loading-text">✦ 宇宙と接続中...</div>
    <div class="card-container disabled" id="oracleCard" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-front-symbol">✦</div>
          <div class="card-front-text">Message from Pleiades</div>
          <div class="card-front-hint" id="cardHint">読み込み中...</div>
        </div>
        <div class="card-face card-back">
          <div class="card-back-label" id="oracleLabel">Today's Message</div>
          <div class="card-back-message" id="oracleMessage"></div>
          <div class="card-back-from">— プレアデス高等評議会 —</div>
        </div>
      </div>
    </div>
    <div id="oracleResult" style="display:none;width:100%;max-width:480px">
      <div class="result-label">このメッセージをさらに深く受け取る</div>
      <div id="oracleContents"></div>
      <div class="share-area">
        <div class="share-text">このメッセージを大切な人に届ける</div>
        <div class="share-buttons">
          <button class="btn btn-ghost" onclick="shareTwitter()" style="font-size:12px;padding:10px 20px;">𝕏 でシェア</button>
          <button class="btn btn-ghost" onclick="downloadShareImage()" style="font-size:12px;padding:10px 20px;">🖼 画像を保存</button>
          <button class="btn btn-ghost" onclick="copyLink()" style="font-size:12px;padding:10px 20px;" id="copyBtn">リンクをコピー</button>
        </div>
      </div>
      <div id="oracleBottomArea"></div>
      <div id="historyPanel" class="history-panel" style="display:none"></div>
    </div>
  </div>

  <!-- SCREEN: Diagnostic -->
  <div class="screen" id="screen-diag">
    <div id="diagFlow"></div>
  </div>

  <div class="footer">
    <div class="footer-links">
      <a href="https://www.youtube.com/@Spiritual_Agent" target="_blank">YouTube</a>
      <a href="https://note.com/spiritual_agent" target="_blank">Note</a>
      <a href="https://open.spotify.com/show/6zHtvjtXWbMWyInlSG11cs" target="_blank">Podcast</a>
    </div>
    <div class="footer-copy">© 2026 Spiritual Agent</div>
  </div>
</div>

<script>
// ==========================================
// DATA
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxq5sicRIyENXqulJGV6GBdb23C7GIN0BUfs8aM2NSD_IutrmOAW-t8746O6zPgxnhS2w/exec";

let CONTENTS = [];
let ORACLE_MESSAGES = [];
let dataLoaded = false;

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    CONTENTS = data.contents || [];
    ORACLE_MESSAGES = data.messages || [];
    console.log("データ読み込み完了:", CONTENTS.length, "件のコンテンツ,", ORACLE_MESSAGES.length, "件のメッセージ");
  } catch (err) {
    console.error("データ読み込みエラー:", err);
    // フォールバック
    CONTENTS = [{id:"y1",type:"youtube",title:"Spiritual Agent Channel",url:"https://www.youtube.com/@Spiritual_Agent",tags:["general"]}];
    ORACLE_MESSAGES = [{id:"m0",msg:"あなたは宇宙に愛されています。その事実を今日、思い出してください。",tags:["general"]}];
  }
  dataLoaded = true;
  document.getElementById('loadingIndicator').style.display = 'none';
  initOracleUI();
}

loadData();

// ==========================================
// APP LOGIC
// ==========================================
let currentMode = 'oracle';
let diagState = {step:0, collectedTags:[]};
let isFlipped = false;
let CURRENT_SHARE_TEXT = "";

// ==========================================
// STATE HELPERS（localStorage）
// ==========================================
function todayStr(d) {
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getDiagProfile() {
  try { return JSON.parse(localStorage.getItem('sa_diag_profile') || 'null'); } catch(e) { return null; }
}
function saveDiagProfile(tags, bestKey) {
  try {
    localStorage.setItem('sa_diag_profile', JSON.stringify({tags, bestKey, updatedAt: new Date().toISOString()}));
  } catch(e) {}
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('sa_history') || '[]'); } catch(e) { return []; }
}
function pushHistory(entry) {
  try {
    const h = getHistory();
    h.push(entry);
    while (h.length > 120) h.shift(); // 上限を設けて肥大化を防ぐ
    localStorage.setItem('sa_history', JSON.stringify(h));
  } catch(e) {}
}
function getTodayDraw() {
  const t = todayStr();
  const h = getHistory();
  return h.find(x => x.date === t) || null;
}

function calcStreak(history) {
  if (!history || history.length === 0) return 0;
  const dates = new Set(history.map(h => h.date));
  let streak = 0;
  let cursor = new Date();
  // 今日引いていなければ、昨日までの連続日数を数える
  if (!dates.has(todayStr(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (dates.has(todayStr(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// プロフィールのタグに合致するメッセージを重み付きで抽選する。
// 直近の履歴に含まれるメッセージは重みを大きく下げ、連続した既読を避ける。
function pickWeightedMessage() {
  const profile = getDiagProfile();
  const profileTags = profile ? profile.tags : [];
  const recentIds = getHistory().slice(-30).map(h => h.messageId);

  const scored = ORACLE_MESSAGES.map(m => {
    const tags = Array.isArray(m.tags) ? m.tags : (typeof m.tags === 'string' ? m.tags.split(',').map(t=>t.trim()) : []);
    let score = 1;
    tags.forEach(t => { if (profileTags.includes(t)) score += 2; });
    if (recentIds.includes(m.id)) score *= 0.05;
    return {m, tags, score};
  });
  const total = scored.reduce((s,x) => s + x.score, 0);
  let r = Math.random() * total;
  for (const x of scored) {
    r -= x.score;
    if (r <= 0) return x;
  }
  return scored[scored.length - 1];
}

function renderStreakBadge() {
  const streak = calcStreak(getHistory());
  const el = document.getElementById('streakBadge');
  if (streak >= 2) {
    el.textContent = `🔥 ${streak}日連続で受け取っています`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderHistoryPanel() {
  const panel = document.getElementById('historyPanel');
  const history = [...getHistory()].reverse().slice(0, 14);
  if (history.length === 0) {
    panel.innerHTML = '<div style="text-align:center;font-size:12px;color:var(--dim)">まだ履歴がありません</div>';
    return;
  }
  panel.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-date">${h.date}</div>
      <div class="history-text">${h.message}</div>
    </div>
  `).join('');
}

function toggleHistoryPanel() {
  const panel = document.getElementById('historyPanel');
  const willShow = panel.style.display === 'none';
  if (willShow) renderHistoryPanel();
  panel.style.display = willShow ? 'block' : 'none';
  gtag('event', 'history_toggle', {event_category: 'oracle', event_label: willShow ? 'open' : 'close'});
}

function renderBottomArea(locked) {
  const area = document.getElementById('oracleBottomArea');
  if (locked) {
    area.innerHTML = `
      <div class="locked-note">✦ 今日のメッセージはこちらです。<br>また明日、新しいメッセージが届きます。</div>
      <button class="history-toggle-btn" onclick="toggleHistoryPanel()">📜 これまでのメッセージを見る</button>
    `;
  } else {
    area.innerHTML = `
      <button class="history-toggle-btn" onclick="toggleHistoryPanel()">📜 これまでのメッセージを見る</button>
    `;
  }
}

// 初回訪問（診断プロフィール未保存）は診断タブを既定表示にする
function chooseInitialMode() {
  const profile = getDiagProfile();
  if (!profile) {
    switchMode('diag');
  }
}

// データ読み込み完了後、今日すでに引いているかどうかでカード表示を分岐する
function initOracleUI() {
  renderStreakBadge();
  const today = getTodayDraw();
  const cardEl = document.getElementById('oracleCard');
  const hintEl = document.getElementById('cardHint');

  if (today) {
    // ロック状態：カードは開けず、今日の結果を直接表示
    isFlipped = true;
    cardEl.classList.add('disabled');
    cardEl.onclick = function() {
      gtag('event', 'oracle_limit_reached', {event_category: 'oracle', event_label: 'already_drawn_today'});
    };
    hintEl.textContent = '今日はすでに受け取りました';
    document.getElementById('cardInner').classList.add('flipped');
    document.getElementById('oracleLabel').textContent = "Today's Message";
    document.getElementById('oracleMessage').innerText = today.message;
    CURRENT_SHARE_TEXT = today.message;
    const contents = getContentsByTags(today.tags || [], 3);
    renderContentCards('oracleContents', contents, 'oracle');
    document.getElementById('oracleResult').style.display = 'block';
    renderBottomArea(true);
  } else {
    cardEl.classList.remove('disabled');
    cardEl.onclick = flipCard;
    hintEl.textContent = 'タップしてカードを開く';
  }
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && mode==='oracle') || (i===1 && mode==='diag'));
  });
  document.getElementById('screen-oracle').classList.toggle('active', mode==='oracle');
  document.getElementById('screen-diag').classList.toggle('active', mode==='diag');
  if (mode === 'diag') { diagState = {step:0,collectedTags:[]}; renderDiagStep(); }
}

// Oracle
function flipCard() {
  if (isFlipped) return;
  if (!dataLoaded || ORACLE_MESSAGES.length === 0) return;
  if (getTodayDraw()) { initOracleUI(); return; } // 二重引き防止（念のため）
  isFlipped = true;

  const picked = pickWeightedMessage();
  const msg = picked.m;
  const msgTags = picked.tags;
  const msgText = msg.msg || msg.message || "";
  const msgId = msg.id || "";

  document.getElementById('oracleMessage').innerText = msgText;
  document.getElementById('cardInner').classList.add('flipped');
  CURRENT_SHARE_TEXT = msgText;
  gtag('event', 'oracle_card_flip', {
    event_category: 'oracle',
    event_label: msgText.substring(0, 50),
    tags: msgTags.join(',')
  });

  pushHistory({date: todayStr(), messageId: msgId, message: msgText, tags: msgTags});

  setTimeout(() => {
    const contents = getContentsByTags(msgTags, 3);
    renderContentCards('oracleContents', contents, 'oracle');
    document.getElementById('oracleResult').style.display = 'block';
    document.getElementById('oracleResult').scrollIntoView({behavior:'smooth',block:'start'});
    renderStreakBadge();
    renderBottomArea(true);
    document.getElementById('oracleCard').onclick = function() {
      gtag('event', 'oracle_limit_reached', {event_category: 'oracle', event_label: 'already_drawn_today'});
    };
  }, 900);
}

// Diagnostic
const DIAG_STEPS = [
  {
    question:"今、あなたの魂はどんな状態ですか？",

// Content matching
function getContentsByTags(tags, count) {
  if (!tags || tags.length === 0) {
    // タグなしの場合はランダムに返す
    const shuffled = [...CONTENTS].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count);
  }
  const scored = CONTENTS.map(c => {
    const cTags = Array.isArray(c.tags) ? c.tags : (typeof c.tags === 'string' ? c.tags.split(',').map(t=>t.trim()) : []);
    const score = cTags.filter(t => tags.includes(t)).length;
    return {...c, score, cTags};
  });
  scored.sort((a,b) => b.score - a.score || Math.random() - 0.5);
  const result = [];
  const usedTypes = new Set();
  for (const c of scored) {
    if (result.length >= count) break;
    if (!usedTypes.has(c.type) || result.length >= count - 1) {
      result.push(c);
      usedTypes.add(c.type);
    }
  }
  for (const c of scored) {
    if (result.length >= count) break;
    if (!result.includes(c)) result.push(c);
  }
  return result.slice(0, count);
}

function renderContentCards(containerId, contents, context) {
  const container = document.getElementById(containerId);
  if (!container) return;
  context = context || 'unknown';
  container.innerHTML = contents.map((c, idx) => {
    const typeLabel = c.type === 'youtube' ? '▶ YouTube' : c.type === 'note' ? '📖 Note' : '🎧 Podcast';
    const typeClass = 'type-' + c.type;
    const title = (c.title || '').substring(0,40).replace(/'/g,'');
    return `
      <a class="content-card" href="${c.url}" target="_blank" rel="noopener" onclick="gtag('event','content_click',{event_category:'content',event_label:'${c.type}: ${title}',content_position:${idx+1},content_context:'${context}'})">
        <div class="content-type ${typeClass}">${typeLabel}</div>
        <div class="content-title">${c.title}</div>
      </a>
    `;
  }).join('');
}

// 画像カードシェア（Canvas生成）
function wrapCanvasText(ctx, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapAndFit(ctx, text, maxWidth, maxLines, startSize, minSize) {
  let size = startSize;
  let lines = [text];
  while (size >= minSize) {
    ctx.font = `${size}px "Noto Serif JP", serif`;
    lines = wrapCanvasText(ctx, text, maxWidth);
    if (lines.length <= maxLines) break;
    size -= 2;
  }
  return {lines, size};
}

async function buildShareCanvas(messageText) {
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }

  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const cs = getComputedStyle(document.documentElement);
  const pick = (name, fallback) => (cs.getPropertyValue(name) || '').trim() || fallback;
  const bg = pick('--bg', '#07060e');
  const accent = pick('--accent', '#9b8aff');
  const accent2 = pick('--accent2', '#c5a0ff');
  const gold = pick('--gold', '#e8c469');
  const bright = pick('--bright', '#f4f2ff');
  const dim = pick('--dim', '#6e6b8a');

  // 背景グラデーション
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#12103a');
  grad.addColorStop(1, bg);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 星
  for (let i = 0; i < 100; i++) {
    ctx.beginPath();
    ctx.arc(Math.random()*W, Math.random()*H, Math.random()*1.8+0.4, 0, Math.PI*2);
    ctx.fillStyle = `rgba(200,190,255,${(Math.random()*0.5+0.15).toFixed(2)})`;
    ctx.fill();
  }

  // 枠線
  ctx.strokeStyle = 'rgba(155,138,255,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(36, 36, W-72, H-72);

  ctx.textAlign = 'center';

  // シンボル（✦の代替を図形で描画）
  const sx = W/2, sy = 150, ssize = 30;
  ctx.fillStyle = accent2;
  ctx.beginPath();
  ctx.moveTo(sx, sy-ssize); ctx.lineTo(sx-ssize*0.28, sy); ctx.lineTo(sx, sy+ssize); ctx.lineTo(sx+ssize*0.28, sy);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx-ssize, sy); ctx.lineTo(sx, sy-ssize*0.28); ctx.lineTo(sx+ssize, sy); ctx.lineTo(sx, sy+ssize*0.28);
  ctx.closePath(); ctx.fill();

  // ロゴラベル
  ctx.fillStyle = accent;
  ctx.font = "28px 'Zen Kaku Gothic New', sans-serif";
  ctx.fillText('S P I R I T U A L   A G E N T', W/2, 230);

  ctx.fillStyle = gold;
  ctx.font = "20px 'Noto Sans JP', sans-serif";
  ctx.fillText("Today's Message", W/2, 270);

  // メッセージ本文（自動改行・自動縮小）
  const maxWidth = W - 200;
  const {lines, size} = wrapAndFit(ctx, messageText, maxWidth, 8, 46, 28);
  ctx.font = `${size}px "Noto Serif JP", serif`;
  ctx.fillStyle = bright;
  const lineHeight = size * 1.7;
  const startY = H/2 - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, i) => ctx.fillText(line, W/2, startY + i*lineHeight));

  // フッター
  ctx.fillStyle = dim;
  ctx.font = "20px 'Noto Sans JP', sans-serif";
  ctx.fillText('— プレアデス高等評議会 —', W/2, H-160);

  ctx.fillStyle = accent2;
  ctx.font = "16px 'Noto Sans JP', sans-serif";
  ctx.fillText('spiritualagent.github.io/spiritual-agent-oracle', W/2, H-100);

  return canvas;
}

async function downloadShareImage() {
  if (!CURRENT_SHARE_TEXT) return;
  gtag('event', 'share', {event_category: 'share', event_label: 'image_card'});
  let canvas;
  try {
    canvas = await buildShareCanvas(CURRENT_SHARE_TEXT);
  } catch (e) {
    console.error('画像生成エラー:', e);
    return;
  }
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'spiritual-agent-message.png', {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try {
        await navigator.share({files: [file], title: 'Spiritual Agent', text: '今日のメッセージ'});
        return;
      } catch (e) {
        // ユーザーによるキャンセル等はダウンロードにフォールバック
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spiritual-agent-message.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

// STARS BACKGROUND
// ==========================================
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.3,
        speed: Math.random() * 0.005 + 0.002,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed * 100 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,190,255,' + (alpha * 0.6) + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  draw();
})();
